name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleCiRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/ciRelease/app-ci-release.apk QuranKita.apk

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuranKita-Test-Report
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranKita-APK
          path: QuranKita.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "QuranKita ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## QuranKita ${{ github.ref_name }}

            Aplikasi Al-Qur'anul Karim & pendamping ibadah harian — offline-first, bebas iklan, ringan.

            ### Unduh
            Ambil berkas `QuranKita.apk` di bawah, lalu pasang langsung di perangkat Android Anda.
          files: |
            QuranKita.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
